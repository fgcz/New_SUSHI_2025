# AI DRAFT - NOT ADOPTED. Bulk RNA-seq for libraries whose Read 1 is ANTISENSE to the
# transcript (Illumina dUTP chemistry). Design decision D2 (revised 2026-10-01): an AI may
# draft a recipe; a bioinformatician decides whether to adopt it and is accountable for it.
# Until then the engine never selects it automatically and runs it by name only on the test
# instance (fgcz-h-083). Review guide: drafts/REVIEW.md.
#
# ## Which orders it is for (measured, B-Fabric PRODUCTION, orders created 2025-10-01..2026-10-01)
#
# 199 orders had Sequencing Application "Transcriptome Sequencing", all of them service type
# "High Throughput Sequencing (NGS)" (FGCZ makes the library, so the kit is recorded on all
# 199). The two kits below are 44 + 10 = 54 of them. Source: scripts/omakase_field_audit/.
#
# ## Why strandMode: antisense
#
# Illumina documents that in its Stranded mRNA, Stranded Total, TruSeq Stranded mRNA and
# TruSeq Stranded Total workflows "Read 1 maps to the antisense strand and Read 2 maps to the
# sense strand" (dUTP second-strand marking):
#   https://knowledge.illumina.com/library-preparation/rna-library-prep/library-preparation-rna-library-prep-reference_material-list/000002238
# In ezRun `antisense` is featureCounts strandSpecific = 2 (ezRun R/app-featureCounts.R:84-90),
# the usual setting for this chemistry.
#
# ## What the data decides, not this file
#
# * refBuild: from the dataset's Species column via /srv/GT/reference-favorite (the curated
#   build per species). An order whose dataset has no Species, two species, or an uncurated
#   species is refused - nobody guesses a genome.
# * paired: left out on purpose. The backend applies each app's own defaults before the
#   recipe's parameters, and STARApp/FastqcApp set paired = "the dataset has a Read2 column"
#   (STARApp.rb:139, FastqcApp.rb set_default_parameters). FeatureCounts then reads paired
#   and strandMode from STAR's output columns (FeatureCountsApp.rb:68-72).
#
# ## Open questions for the reviewer (see drafts/REVIEW.md)
#
# Q1  Illumina recommends trimming the first base of each read for Stranded mRNA (a T is
#     added for ligation, low diversity in cycle 1). STARApp offers `trim_front1` (fastp).
#     Left at the app default 0 here. Set it to 1?
# Q2  The two "Truseq" entries B-Fabric offers ("Illumina Truseq mRNA", 7 orders;
#     "Illumina Truseq Total RNA (ribosomal depletion)", 6) are NOT listed: their names do not
#     say "Stranded", and TruSeq RNA v2 was unstranded. Add them if FGCZ's TruSeq kits are the
#     stranded ones.
# Q3  Total RNA (ribo-depleted) and mRNA libraries share one chain here. Different QC
#     expectations (intronic fraction) are not expressed.
# Q4  Fewer than 3 samples: CountQC failed inside its report on a 2-sample dataset
#     (2026-09-11) and has no sample-count guard. The order cannot tell the real sample
#     count (see `match` below), so a 1-2 sample order would reach CountQC and halt there.
#     Drop CountQC, or accept that halt?
# Q5  Resources are each app's shipped defaults; STAR 30 GB with one retry at 60 GB.
#     Is 30 GB enough for GRCh38/GRCm39 on FGCZ's STAR indexes?
# Q6  No differential expression step: the control-versus-treatment grouping is a judgement
#     nothing here can make.

schema_version: 1
id: bulk_rnaseq_stranded_antisense
version: 1
author: >
  AI draft (Claude Opus 5.5 via Claude Code, 2026-10-01) - NOT adopted. Written from vendor
  documentation, the SUSHI app definitions and aggregate B-Fabric order counts; no order
  record or sample data was read.
description: >
  Bulk RNA-seq for Illumina dUTP-stranded libraries (Read 1 antisense): FastQC, FastQ Screen
  and STAR side by side, then featureCounts, then CountQC. Genome from the dataset's Species.

match:
  # No service_type rule: all 199 such orders are NGS service anyway, and a real order event
  # carries the service type as an id without a name, which a service_type rule can never
  # match (recorded 2026-10-01, not fixed).
  sequencing_application: ["Transcriptome Sequencing"]
  library_protocol:
    - "Illumina Stranded mRNA Prep, Ligation"                          # 44 orders
    - "Illumina Stranded Total RNA Prep, Ligation with Ribo-Zero Plus"  # 10 orders
  # 29 of 163 answered orders declare transgenes: the curated genome lacks them, so a person
  # chooses. 36 orders do not answer; "unknown" is not "no", so they abstain too.
  samples_contain_transgenes: false
  species_in_reference_catalog: true
  # No `samples` rule, on purpose (measured 2026-10-01): the order's `countsamples` counts
  # every sample record - biological, library, pool, on-run, QC - a median 5.2x the
  # biological samples over 25 orders, and the declared `numberofsamples` is missing on 83 of
  # these 152 orders. A rule on it would test the wrong number. See REVIEW.md Q-samples.

steps:
  - id: fastqc
    app: FastqcApp
    after: []
    params: {cores: 8, ram: 15, scratch: 100}
    # FastqcApp offers ram [15, 30, 62].
    retry_params: {ram: 30}

  - id: fastqscreen
    app: FastqScreenApp
    after: []
    params: {cores: 8, ram: 60, scratch: 100}

  - id: star
    app: STARApp
    after: []
    params:
      cores: 8
      ram: 30
      scratch: 100
      refBuild: "{{ reference_for(species) }}"
      strandMode: antisense
    # STARApp offers ram ['30','40','60','330']; 60 is the next rung that doubles.
    retry_params: {ram: 60, scratch: 200}

  - id: featurecounts
    app: FeatureCountsApp
    after: [star]
    params: {cores: 8, ram: 20, scratch: 10}
    retry_params: {ram: 40, scratch: 20}

  - id: countqc
    app: CountQCApp
    after: [featurecounts]
    params: {cores: 1, ram: 8, scratch: 10}
    # CountQCApp offers ram ['8','12','50'].
    retry_params: {ram: 12, scratch: 20}

autostart: false
autostart_blocked_by: Unadopted AI draft (design D2). A bioinformatician adopts it into the catalog first.
