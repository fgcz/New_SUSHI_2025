# DISABLED. Kept because it records a trap that cost a live 422 to find.
#
# FlashApp looks like a perfect first chain: `GET /api/v1/datasets/9` lists it among 175
# applicable apps, its `next_dataset` emits `Read1 [File]`, and FastqcApp requires exactly
# `Name` and `Read1`. So the chain is column-compatible and reads correctly on paper.
#
# It cannot be submitted. The backend accepts **18** apps -- one native (`Fastqc`) plus the
# 17 in `config.legacy_apps_allowlist` -- and FlashApp is not among them. The dataset
# endpoint answers "which apps could consume these columns"; it does not answer "which apps
# will this backend run", and the two lists differ by an order of magnitude.
#
# The runner checks `GET /api/v1/application_configs` before submitting, so a recipe naming
# an unsubmittable app halts with a clear reason instead of a 422. This file is the
# regression case in prose.
#
# Format v1 since 2026-09-24 (was `version: v0-disabled`, `match: {disabled: true}`).
# Every match list is empty, so automatic selection can never pick it.

schema_version: 1
id: flash_then_fastqc
version: 1
author: Masaomi Hatakeyama (engine fixture - disabled, kept as a record)
description: >
  DISABLED. FlashApp is column-compatible with dataset 9 but is not in the backend's
  submittable allow-list. Kept as a record of the difference between the two app lists.

match:
  service_type: []
  sequencing_application: []

steps:
  - app: FlashApp        # <- not submittable; the runner will halt here by design
    params:
      cores: 4
      ram: 15
      scratch: 50

  - app: FastqcApp
    params:
      cores: 1
      ram: 15
      scratch: 10

autostart: false
autostart_blocked_by: Disabled - FlashApp is not in the backend's submittable allow-list.
