# SUSHI Application Configuration
# Configure SLURM partitions and other settings based on deployment type

defaults: &defaults
  # SLURM partition configuration
  partition:
    # Default partition to use
    default: employee
    # Available partitions (if empty, fetch dynamically from sinfo)
    available: []
    # Whether to fetch partitions dynamically from SLURM (sinfo command)
    dynamic: true
  
  # Storage configuration
  storage:
    # Scratch directory for temporary files (local to compute nodes)
    scratch_dir: /scratch
    # GStore directory (shared storage, read-only from application server)
    gstore_dir: /srv/gstore/projects
    # Where the job_manager daemon writes a job's stdout/stderr WHILE it runs.
    # They move into the gStore result dir only when the job completes, so a
    # running job's logs live here and nowhere else.
    #
    # A LIST, because this directory has moved and differs between nodes. The
    # first entry is where the daemon serving 082 writes (measured 2026-09-01
    # against a live RUNNING job); the second was the only configured value until
    # then and had not been written to since 2026-08-28. One path meant a running
    # job's logs answered "Logs not found" even though the file existed and was
    # world-readable.
    job_log_dirs:
      - /misc/fgcz01/sushi/job_scripts
      - /misc/fgcz01/sushi/.trxcopy/job_scripts
    # Copy method: 'g-req' for production (FGCZ), 'rsync' for demo/local
    copy_method: g-req

development:
  <<: *defaults
  # In development, always use 'employee' partition
  partition:
    default: employee
    available: [employee]
    dynamic: false
  storage:
    scratch_dir: /scratch
    gstore_dir: /srv/gstore/projects
    job_log_dirs:
      - /misc/fgcz01/sushi/job_scripts
      - /misc/fgcz01/sushi/.trxcopy/job_scripts
    copy_method: g-req  # Use g-req for FGCZ environment

test:
  <<: *defaults
  partition:
    default: employee
    available: [employee]
    dynamic: false
  storage:
    scratch_dir: /tmp/scratch
    gstore_dir: /tmp/gstore
    copy_method: rsync  # Use rsync for test environment

# Production deployment types
# Set SUSHI_TYPE environment variable to select: production, demo, course, test_server
production:
  <<: *defaults
  # Production type-specific settings (selected by SUSHI_TYPE env var)
  types:
    production:
      partition:
        default: employee
        available: []  # empty = fetch dynamically from sinfo
        dynamic: true
    demo:
      partition:
        default: user
        available: [user, employee]
        dynamic: false
    course:
      partition:
        default: course
        available: [course]
        dynamic: false
    test_server:
      partition:
        default: employee
        available: [employee, user]
        dynamic: false

