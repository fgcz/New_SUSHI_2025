[project]
name = "multiomics-studio-backend"
version = "0.1.0"
description = "MultiOmicsStudio FastAPI backend with SQLite and LDAP"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",

    # Database (SQLite is built-in)
    "sqlmodel>=0.0.22",
    "alembic>=1.13.0",

    # LDAP authentication
    "ldap3>=2.9.0",

    # JWT authentication
    "PyJWT[crypto]>=2.8.0",

    # Configuration
    "pydantic-settings>=2.0.0",

    # Utilities
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "app.api.routes.*"
disable_error_code = ["union-attr", "arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
